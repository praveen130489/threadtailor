<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign Up — Thread & Tailor</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div class="header"><div class="container header-inner"><a href="/" class="logo"><span class="logo-badge">TT</span> Thread & Tailor</a></div></div>
<main class="container section"><h1>Create account</h1>
<form class="mt-16"><label>Name<br><input required style="width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);background:var(--surface);color:var(--text)"></label>
<label class="mt-16">Email<br><input type="email" required style="width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);background:var(--surface);color:var(--text)"></label>
<label class="mt-16">Password<br><input type="password" required style="width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);background:var(--surface);color:var(--text)"></label>
<div class="mt-16"><button class="btn btn-primary">Create account</button></div></form></main>
<script defer src="/js/main.js"></script></body></html>
